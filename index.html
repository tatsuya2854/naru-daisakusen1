<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120920">
<title>Halloween大作戦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#120920;
  --night2:#1B0F2C;
  --panel:#211135;
  --pumpkin:#FF7A18;
  --ember:#FFB63A;
  --ghost:#C9B6FF;
  --witch:#FF4D7E;
  --slime:#8BE04E;
  --bone:#FFF6E9;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;background:#120920;}
body{
  min-height:100%;
  color:#fff;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
.wrap{max-width:680px;margin:0 auto;background:var(--night);position:relative;overflow:hidden;}
@media (min-width:700px){.wrap{margin:24px auto;border-radius:26px;box-shadow:0 30px 70px -30px #000;}}

/* ══ 導入（最初の1.5秒） ══ */
.head{
  position:relative;padding:44px 20px 38px;text-align:center;overflow:hidden;
  background:
    radial-gradient(circle at 50% 2%, rgba(255,182,58,.26), transparent 48%),
    radial-gradient(circle at 8% 96%, rgba(139,224,78,.12), transparent 46%),
    linear-gradient(172deg,#3A1553 0%,#211135 58%,#150C24 100%);
}
.moon{
  position:absolute;top:18px;left:50%;width:70px;height:70px;margin-left:-35px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#FFF3D2,#FFC24D 58%,#F79A2C);
  box-shadow:0 0 50px 18px rgba(255,183,71,.36);
  animation:moonRise 1.15s var(--spring) both;
}
.moon::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 66% 62%,rgba(196,134,40,.45) 6px,transparent 7px),
    radial-gradient(circle at 33% 67%,rgba(196,134,40,.32) 4.5px,transparent 5.5px),
    radial-gradient(circle at 57% 31%,rgba(196,134,40,.28) 3px,transparent 4px);
}
@keyframes moonRise{
  0%{opacity:0;transform:translateY(26px) scale(.55);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}
.bat{
  position:absolute;left:0;top:0;color:#0E0718;
  filter:drop-shadow(0 0 7px rgba(201,182,255,.4));
  will-change:transform;
  opacity:0;transition:opacity .9s var(--ease);
}
.bat.show{opacity:1;}
.bat.b3{opacity:0;}
.bat.b3.show{opacity:.55;}
.bat svg{display:block;width:100%;height:auto;overflow:visible;}

.title{
  position:relative;margin:38px 0 0;
  font-family:"Creepster","M PLUS Rounded 1c",cursive;
  font-size:47px;line-height:1;letter-spacing:.04em;color:var(--pumpkin);
  text-shadow:0 0 24px rgba(255,122,24,.6),3px 4px 0 #5A1B0B;
  animation:dropIn .95s .18s var(--spring) both;
}
.sub{
  position:relative;margin:10px 0 0;font-size:27px;font-weight:800;
  text-shadow:2px 3px 0 #6B2FA8;
  animation:dropIn .9s .34s var(--spring) both;
}
.lead{
  position:relative;margin:15px 0 0;font-size:13.5px;font-weight:500;color:#E7DCFF;
  animation:fadeUp .8s .5s var(--ease) both;
}
.lead strong{color:var(--ember);font-weight:800;}
@keyframes dropIn{0%{opacity:0;transform:translateY(-24px) scale(.9);}100%{opacity:1;transform:none;}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(14px);}100%{opacity:1;transform:none;}}

/* 進捗 */
.prog{
  position:relative;display:inline-flex;align-items:center;gap:10px;
  margin-top:18px;padding:8px 16px;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,182,58,.42);
  border-radius:999px;font-size:13px;font-weight:800;color:#FFD98A;
  animation:fadeUp .8s .66s var(--ease) both;
}
.prog .dots{display:flex;gap:5px;}
.prog .dots i{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,.18);
  transition:background .3s var(--ease),transform .45s var(--spring),box-shadow .3s;
}
.prog .dots i.on{background:var(--ember);transform:scale(1.35);box-shadow:0 0 10px var(--ember);}
.prog b{color:#fff;font-size:15px;font-variant-numeric:tabular-nums;}

/* BGM */
.bgm{
  position:absolute;top:14px;right:14px;z-index:6;
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;
  background:rgba(18,9,32,.66);border:1.5px solid rgba(255,182,58,.5);border-radius:999px;
  color:#FFD98A;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:transform .35s var(--spring),box-shadow .3s var(--ease),background .3s;
  animation:fadeUp .7s .8s var(--ease) both;
}
.bgm:active{transform:scale(.92);}
.bgm.pending{border-color:rgba(255,182,58,.9);animation:beat 1.6s ease-in-out infinite;}
.bgm.on{background:var(--ember);color:#38200A;border-color:#FFE7B0;box-shadow:0 0 20px -3px var(--ember);}
.bgm .wave{display:inline-flex;align-items:flex-end;gap:2.5px;height:12px;}
.bgm .wave i{width:2.5px;height:4px;border-radius:2px;background:currentColor;transition:height .2s;}
.bgm.on .wave i{animation:eq .95s ease-in-out infinite;}
.bgm.on .wave i:nth-child(2){animation-delay:.16s;}
.bgm.on .wave i:nth-child(3){animation-delay:.32s;}
@keyframes eq{0%,100%{height:4px;}50%{height:12px;}}

/* ドリップ */
.drip{position:relative;height:9px;background:var(--pumpkin);z-index:3;transform-origin:left;animation:wipe .7s .55s var(--ease) both;}
.drip::after{content:"";position:absolute;top:100%;left:0;right:0;height:16px;
  background:radial-gradient(circle at 13px 0,var(--pumpkin) 12px,transparent 13px) repeat-x;background-size:52px 30px;}
.drip::before{content:"";position:absolute;top:100%;left:26px;right:0;height:22px;
  background:radial-gradient(circle at 11px 0,var(--pumpkin) 9px,transparent 10px) repeat-x;background-size:52px 30px;}
@keyframes wipe{0%{transform:scaleX(0);}100%{transform:scaleX(1);}}

/* ══ 日別 ══ */
.list{list-style:none;margin:0;padding:24px 0 0;}
.day{
  position:relative;display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;
  align-items:center;padding:16px 14px;
  opacity:0;transform:translateY(26px);
  transition:opacity .6s var(--ease),transform .7s var(--ease);
}
.day.in{opacity:1;transform:none;}
.day:nth-child(odd){background:var(--night2);}
.day:nth-child(even){background:var(--night);}
.day+.day{border-top:2px dashed rgba(255,122,24,.28);}
.day:nth-child(1){--c:var(--pumpkin);}
.day:nth-child(2){--c:var(--ghost);}
.day:nth-child(3){--c:var(--witch);}
.day:nth-child(4){--c:var(--slime);}

/* 今日ここ */
.day.today::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;
  background:var(--ember);box-shadow:0 0 14px var(--ember);
  animation:beat 2.4s ease-in-out infinite;
}
@keyframes beat{0%,100%{opacity:.55;}50%{opacity:1;}}
.tag-today{
  display:none;align-items:center;padding:2px 9px;border-radius:999px;
  background:var(--ember);color:#3A2000;font-size:10.5px;font-weight:800;
  animation:pop .5s var(--spring) both;
}
.day.today .tag-today{display:inline-flex;}
@keyframes pop{0%{transform:scale(.5);opacity:0;}100%{transform:scale(1);opacity:1;}}

/* ══ カボチャ ══ */
.lamp{
  position:relative;width:78px;height:88px;padding:0;border:0;background:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.lamp .stage{
  display:block;position:relative;width:100%;height:100%;
  transition:transform .4s var(--spring);
}
.lamp:active .stage{transform:scale(.9);}
.lamp.pulse .stage{animation:lampPop .6s var(--spring);}
@keyframes lampPop{0%{transform:scale(.86);}45%{transform:scale(1.14) rotate(-5deg);}100%{transform:scale(1);}}
.lamp .pk{
  position:absolute;left:0;top:4px;width:100%;height:auto;display:block;
  transition:opacity .4s var(--ease);
}
/* 消灯：くすんだ紫。点灯：フルカラー。opacityのクロスフェードだけで切り替える（filterは端末で不安定なため不使用） */
.pk.dim{--pkA:#4B3C57;--pkB:#3B2E46;--pkC:#57466A;--pkFace:#241B2E;--pkStem:#3F4A3E;--pkHi:#5E4C6E;opacity:1;}
.pk.lit{--pkA:#EE7A12;--pkB:#C85D0B;--pkC:#FF9A38;--pkFace:#FFE27A;--pkStem:#5B9C42;--pkHi:#FFAE5C;opacity:0;}
.lamp.on .pk.dim{opacity:0;}
.lamp.on .pk.lit{opacity:1;}
.lamp .halo{
  position:absolute;left:50%;top:52%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;
  background:radial-gradient(circle,var(--c) 0%,rgba(0,0,0,0) 62%);
  opacity:0;transition:opacity .5s var(--ease);pointer-events:none;
}
.lamp.on .halo{opacity:.4;}
.lamp .flame{
  position:absolute;left:50%;top:-10px;margin-left:-13px;width:26px;height:38px;
  opacity:0;transform:scale(.2) translateY(12px);transform-origin:50% 100%;
  transition:opacity .35s var(--ease),transform .55s var(--spring);
  pointer-events:none;overflow:visible;
  filter:drop-shadow(0 0 7px rgba(255,150,30,.85));
}
.lamp.on .flame{opacity:1;transform:none;}
.lamp .flame path{transition:none;}
.lamp .hint{
  position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);
  font-size:9.5px;font-weight:800;color:#8B78A6;white-space:nowrap;
  transition:opacity .3s;
}
.lamp.on .hint{opacity:0;}
.day.today .lamp .hint{color:var(--ember);animation:beat 2s ease-in-out infinite;}
.ember{position:absolute;left:50%;top:40%;width:6px;height:6px;border-radius:50%;background:var(--ember);pointer-events:none;}

/* ══ カード ══ */
.card{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0;text-decoration:none;color:#fff;}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.part{border:1.5px solid var(--c);color:var(--c);border-radius:999px;padding:2px 12px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.num{font-size:22px;font-weight:800;text-shadow:0 0 12px var(--c);}
.thumb{
  position:relative;min-width:0;background:var(--bone);border-radius:14px;padding:6px 6px 2px;
  box-shadow:0 4px 0 rgba(0,0,0,.5);
  transition:transform .4s var(--spring),box-shadow .35s var(--ease);
}
.shot{position:relative;border-radius:9px;overflow:hidden;background:#E8DCCE;aspect-ratio:16/9;}
.shot img{
  display:block;width:100%;height:100%;object-fit:cover;
  opacity:0;transform:scale(1.04);
  transition:opacity .6s var(--ease),transform .8s var(--ease);
}
.shot img.ready{opacity:1;transform:none;}
.skel{
  position:absolute;inset:0;
  background:linear-gradient(100deg,#E8DCCE 20%,#FBF3E7 45%,#E8DCCE 70%);
  background-size:220% 100%;
  animation:shimmer 1.4s linear infinite;
  transition:opacity .45s var(--ease);
}
.skel.gone{opacity:0;}
@keyframes shimmer{0%{background-position:120% 0;}100%{background-position:-120% 0;}}
.cap{
  display:block;margin:7px 0 6px;padding:7px 11px;
  background:linear-gradient(100deg,#2A1633,#3A1E44);
  border-left:3px solid var(--c);
  border-radius:8px;
  color:#FFF1DC;font-size:11.5px;font-weight:700;line-height:1.45;
  letter-spacing:.01em;
}
.cap em{font-style:normal;color:var(--c);}
.card:active .thumb{transform:scale(.975);box-shadow:0 2px 0 rgba(0,0,0,.5);}
@media (hover:hover){
  .card:hover .thumb{transform:translateY(-8px) rotate(-.7deg);box-shadow:0 13px 0 rgba(0,0,0,.5),0 0 28px -4px var(--c);}
  .lamp:hover .stage{transform:scale(1.06) rotate(-4deg);}
}
.card:focus-visible{outline:3px solid var(--c);outline-offset:4px;border-radius:16px;}
.lamp:focus-visible{outline:3px solid var(--ember);outline-offset:2px;border-radius:16px;}

/* ══ フッター ══ */
.flash{
  position:fixed;inset:0;pointer-events:none;z-index:20;opacity:0;
  background:radial-gradient(circle at 50% 60%,rgba(255,196,80,.85),rgba(255,122,24,.35) 40%,transparent 72%);
  transition:opacity .12s linear;
}
.flash.go{animation:flashOut 1.1s var(--ease) forwards;}
@keyframes flashOut{0%{opacity:0;}12%{opacity:.85;}100%{opacity:0;}}
.foot{
  position:relative;text-align:center;padding:30px 18px 36px;font-size:13.5px;font-weight:700;
  background:radial-gradient(circle at 50% 132%,rgba(139,224,78,.22),transparent 62%),var(--panel);
  overflow:hidden;
}
.foot .ghost{width:52px;margin:0 auto 10px;will-change:transform;}
.foot .ghost svg{display:block;width:100%;height:auto;overflow:visible;}
.done{display:block;color:var(--ember);font-size:16px;margin-bottom:2px;}
.reset{
  margin-top:18px;background:none;border:0;color:#7A6694;font-family:inherit;
  font-size:11px;font-weight:700;text-decoration:underline;cursor:pointer;
  transition:transform .3s var(--spring),color .3s;
}
.reset:active{transform:scale(.94);color:#A78EC8;}

@media (min-width:620px){
  .head{padding:52px 26px 46px;}
  .title{font-size:58px;} .sub{font-size:31px;}
  .day{grid-template-columns:92px minmax(0,1fr);gap:16px;padding:18px 20px;}
  .lamp{width:92px;height:100px;}
  .card{grid-template-columns:136px minmax(0,1fr);align-items:center;gap:16px;}
  .meta{flex-direction:column;align-items:flex-start;gap:6px;}
  .num{font-size:26px;} .cap{font-size:12.5px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition-duration:.01ms !important;}
  .day{opacity:1;transform:none;}
  html{scroll-behavior:auto;}
}
</style>
</head>

      </button>
      <a class="card" href="https://youtu.be/gNtu--Z24Gc" target="_blank" rel="noopener noreferrer">
        <div class="meta"><span class="part">全身</span><span class="num">Day4</span><span class="tag-today">今日ここ</span></div>
        <div class="thumb">
          <div class="shot">
            <div class="skel"></div>
            <img src="https://img.youtube.com/vi/gNtu--Z24Gc/maxresdefault.jpg" onerror="this.onerror=null;this.src='https://img.youtube.com/vi/gNtu--Z24Gc/hqdefault.jpg';" alt="Day4 シン・フリフリダンス 9分">
          </div>
          <span class="cap"><em>全身痩せはこれっしょ。</em>フリフリダンス</span>
        </div>
      </a>
    </li>

  </ol>

  <div class="flash" id="flash"></div>

  <footer class="foot" id="foot">
    <div class="ghost">
      <svg viewBox="0 0 48 56">
        <g id="gBody">
          <path d="M24 2C12 2 6 12 6 23v27l6-5 6 5 6-5 6 5 6-5 6 5V23C42 12 36 2 24 2z" fill="#EDE7FF"/>
          <ellipse cx="11" cy="32" rx="4" ry="2.6" fill="#FFB6D5" opacity=".8"/>
          <ellipse cx="37" cy="32" rx="4" ry="2.6" fill="#FFB6D5" opacity=".8"/>
          <g id="gEyes">
            <ellipse cx="17" cy="24" rx="3.4" ry="4.4" fill="#3A2450"/>
            <ellipse cx="31" cy="24" rx="3.4" ry="4.4" fill="#3A2450"/>
          </g>
          <path id="gMouth" d="M20 32c1.6 2.6 6.4 2.6 8 0" stroke="#3A2450" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <div id="msg">待ってろよ！今日よりカワイイ明日の自分！</div>
    <button class="reset" id="reset" type="button">灯りを全部消す（リセット）</button>
  </footer>

</div>

<script>
(function(){
  var KEY='hw-lit-2026', SKEY='hw-sound';
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lamps=[].slice.call(document.querySelectorAll('.lamp'));
  var days=[].slice.call(document.querySelectorAll('.day'));
  var cnt=document.getElementById('cnt');
  var dots=document.getElementById('dots').children;
  var msg=document.getElementById('msg');
  var foot=document.getElementById('foot');
  var flash=document.getElementById('flash');
  var BASE='待ってろよ！今日よりカワイイ明日の自分！';

  /* URLの末尾に ?fresh を付けて開くと、初回訪問と同じ「全部消えた状態」で確認できる */
  try{ if(location.search.indexOf('fresh')>-1) localStorage.removeItem(KEY); }catch(e){}
  var EXPIRE=30*24*60*60*1000;   /* 最後に触ってから30日で自動リセット＝翌シーズンは真っさら */
  function load(){
    try{
      var raw=JSON.parse(localStorage.getItem(KEY)); if(!raw) return {};
      var d=raw.days||raw, ts=raw.ts||0;
      if(ts && Date.now()-ts>EXPIRE){ localStorage.removeItem(KEY); return {}; }
      return d;
    }catch(e){ return {}; }
  }
  function save(d){ try{ localStorage.setItem(KEY,JSON.stringify({v:1,days:d,ts:Date.now()})); }catch(e){} }
  function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
  function wob(t,s){return Math.sin(t*0.63+s)*0.62+Math.sin(t*1.37+s*2.3)*0.27+Math.sin(t*2.71+s*3.9)*0.11;}

  /* ══════════ 音（BGM・効果音） ══════════ */
  var ctx=null,master=null,bgmGain=null,timer=null,step=0,playing=false,pending=false;
  var btn=document.getElementById('bgm');
  var SC=[220.00,261.63,293.66,329.63,349.23,415.30], MEL=[0,2,3,2,5,3,2,0,3,2,4,2];
  var want=(function(){try{return localStorage.getItem(SKEY)!=='off';}catch(e){return true;}})();

  function ac(){
    if(!ctx){
      var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      ctx=new AC();
      master=ctx.createGain(); master.gain.value=1; master.connect(ctx.destination);
      bgmGain=ctx.createGain(); bgmGain.gain.value=0; bgmGain.connect(master);
    }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  function tone(f,at,dur,type,vol,dest){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||'triangle'; o.frequency.setValueAtTime(f,at);
    g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(vol,at+.015);
    g.gain.exponentialRampToValueAtTime(.0008,at+dur);
    o.connect(g); g.connect(dest||master); o.start(at); o.stop(at+dur+.05);
    return o;
  }
  function sweep(f1,f2,at,dur,vol){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f1,at); o.frequency.exponentialRampToValueAtTime(f2,at+dur);
    g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(vol,at+.02);
    g.gain.exponentialRampToValueAtTime(.0008,at+dur);
    o.connect(g); g.connect(master); o.start(at); o.stop(at+dur+.05);
  }
  function tick(){
    var t=ctx.currentTime+.06, f=SC[MEL[step%MEL.length]];
    tone(f,t,.5,'triangle',.16,bgmGain);
    if(step%4===0) tone(55,t,1.1,'sine',.32,bgmGain);
    if(step%12===0) tone(f*4,t,1.6,'sine',.06,bgmGain);
    if(step%4===2) tone(f*1.5,t,.32,'triangle',.07,bgmGain);
    step++;
  }
  function startBgm(){
    if(!want) return;                       /* 直前にユーザーが切った場合は無視する */
    if(!ac()){ btn.disabled=true; btn.textContent='音 非対応'; return; }
    if(ctx.state!=='running'){
      arm(); pending=true; paint();
      /* resume() は非同期。解決してから鳴らしにいく */
      try{ ctx.resume().then(function(){ if(want&&ctx.state==='running') startBgm(); }); }catch(e){}
      return;
    }
    pending=false; playing=true; paint();
    bgmGain.gain.cancelScheduledValues(ctx.currentTime);
    bgmGain.gain.setValueAtTime(bgmGain.gain.value,ctx.currentTime);
    bgmGain.gain.linearRampToValueAtTime(.5,ctx.currentTime+1.2);
    if(!timer){ tick(); timer=setInterval(tick,430); }
  }
  function stopBgm(){
    playing=false; pending=false; paint();
    if(bgmGain&&ctx){
      bgmGain.gain.cancelScheduledValues(ctx.currentTime);
      bgmGain.gain.setValueAtTime(bgmGain.gain.value,ctx.currentTime);
      bgmGain.gain.linearRampToValueAtTime(0,ctx.currentTime+.35);
    }
    clearInterval(timer); timer=null;
  }
  function paint(){
    btn.classList.toggle('on',playing);
    btn.classList.toggle('pending',pending);
    btn.setAttribute('aria-pressed',playing?'true':'false');
  }
  var armed=false, EVS=['pointerdown','touchend','keydown'];
  function unlock(){
    if(!armed) return; disarm();
    if(want && !playing) setTimeout(startBgm,0);
  }
  function arm(){ if(armed) return; armed=true;
    EVS.forEach(function(ev){document.addEventListener(ev,unlock,true);});
  }
  function disarm(){ armed=false;
    EVS.forEach(function(ev){document.removeEventListener(ev,unlock,true);});
  }
  /* 判定は want（ユーザーの意思）を唯一の基準にする。解錠待ちの処理と競合させない */
  btn.addEventListener('click',function(){
    buzz(8);
    if(want){ want=false; try{localStorage.setItem(SKEY,'off');}catch(e){} disarm(); stopBgm(); }
    else{ want=true; try{localStorage.setItem(SKEY,'on');}catch(e){} startBgm(); }
  });
  /* 開いた瞬間にBGMオン（ブラウザに止められたら最初のタップで自動的に鳴る） */
  if(want) startBgm();

  function canSfx(){ return want && ctx && ctx.state==='running'; }
  /* 日ごとに音を1段ずつ上げていく */
  var STEPS=[[440,660],[523.25,784],[659.25,988],[783.99,1175]];
  function sfxLight(i){
    if(!canSfx()) return;
    var t=ctx.currentTime, p=STEPS[Math.min(i,3)];
    sweep(p[0]*.5,p[0],t,.12,.10);
    tone(p[0],t+.02,.35,'triangle',.13);
    tone(p[1],t+.08,.5,'sine',.10);
  }
  function sfxOff(){ if(!canSfx()) return; var t=ctx.currentTime; sweep(420,150,t,.22,.09); }
  /* 4つ目：ファンファーレ */
  function sfxFinale(){
    if(!canSfx()) return;
    var t=ctx.currentTime, A=[523.25,659.25,783.99,1046.50,1318.51];
    A.forEach(function(f,i){
      tone(f,t+i*.1,.9,'triangle',.14);
      tone(f*2,t+i*.1+.02,.6,'sine',.05);
    });
    tone(65.41,t,1.6,'sine',.34);
    sweep(300,2400,t+.45,.7,.06);
    for(var k=0;k<7;k++) tone(1568+k*160,t+.6+k*.06,.5,'sine',.035);
  }

  /* ══════════ カボチャ（点灯・顔・炎） ══════════ */
  var tplLamp=document.getElementById('tpl-lamp');
  var rigs=lamps.map(function(b,i){
    b.insertBefore(tplLamp.content.cloneNode(true),b.firstChild);
    var litSvg=b.querySelector('.pk.lit')||b.querySelector('.pk');
    // dimを複製してlitを作る（配色はCSS変数で切替）
    var dim=b.querySelector('.pk.dim');
    var lit=dim.cloneNode(true); lit.classList.remove('dim'); lit.classList.add('lit');
    dim.parentNode.insertBefore(lit,dim.nextSibling);
    return {
      el:b, stage:b.querySelector('.stage'),
      eyeL:lit.querySelector('.eyeL'), eyeR:lit.querySelector('.eyeR'), mouth:lit.querySelector('.mouth'),
      fOut:b.querySelector('.fOut'), fMid:b.querySelector('.fMid'), fIn:b.querySelector('.fIn'),
      flame:b.querySelector('.flame'),
      seed:i*7.3+1.4, blinkAt:1+Math.random()*4, blinkEnd:0, on:false
    };
  });

  function flameD(t,seed,scale){
    function n(a,b){return Math.sin(t*a+seed*b)+Math.sin(t*a*1.73+seed*b*1.31)*.45;}
    var tipX=13+n(3.4,1.7)*2.6*scale, tipY=3+ (1-scale)*10 + n(2.6,2.9)*2.2;
    var lw=(6.4+n(2.9,3.3)*1.5)*scale, rw=(6.4+n(3.1,4.1)*1.5)*scale;
    var by=34;
    return 'M13,'+by+
      ' C'+(13-lw-2.4)+','+(25+n(3.6,5)*1.8)+' '+(13-lw)+','+(13+n(4.2,6)*3.2)+' '+tipX.toFixed(2)+','+tipY.toFixed(2)+
      ' C'+(13+rw)+','+(13+n(3.8,7)*3.2)+' '+(13+rw+2.4)+','+(25+n(3.2,8)*1.8)+' 13,'+by+' Z';
  }

  function render(justLit){
    var s=load(), n=0, next=-1;
    rigs.forEach(function(r,i){
      var on=!!s[r.el.dataset.day];
      r.on=on;
      r.el.classList.toggle('on',on);
      r.el.setAttribute('aria-pressed',on?'true':'false');
      if(on){ n++; } else if(next<0){ next=i; }
    });
    days.forEach(function(d,i){ d.classList.toggle('today',i===next); });
    for(var i=0;i<dots.length;i++) dots[i].classList.toggle('on',i<n);
    cnt.textContent=n;
    if(n===rigs.length){
      msg.innerHTML='<span class="done">4日間コンプリート！🏆</span>'+BASE;
      if(justLit) finale();
    }else{
      msg.textContent=n===0?BASE:'あと'+(rigs.length-n)+'日！'+BASE;
    }
    return n;
  }

  function embers(host,num,spread,size){
    if(reduce||!host.animate) return;
    for(var i=0;i<num;i++){
      var s=document.createElement('span'); s.className='ember';
      if(size) {s.style.width=size+'px'; s.style.height=size+'px';}
      var a=Math.random()*Math.PI*2, d=spread*(.45+Math.random());
      host.appendChild(s);
      s.animate([
        {transform:'translate(-50%,-50%) scale(1)',opacity:1},
        {transform:'translate(calc(-50% + '+Math.cos(a)*d+'px), calc(-50% + '+(Math.sin(a)*d-30)+'px)) scale(0)',opacity:0}
      ],{duration:800+Math.random()*700,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=function(){this.effect.target.remove();};
    }
  }
  function finale(){
    sfxFinale(); buzz([18,60,18,60,40]);
    if(reduce) return;
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    rigs.forEach(function(r,i){
      setTimeout(function(){
        r.el.classList.remove('pulse'); void r.el.offsetWidth; r.el.classList.add('pulse');
        embers(r.el,10,42);
      },i*130);
    });
    setTimeout(function(){ embers(foot,26,110,8); if(window.__ghostCheer) window.__ghostCheer(); },560);
  }

  rigs.forEach(function(r){
    r.el.addEventListener('click',function(){
      var s=load(), d=r.el.dataset.day, on=!s[d];
      if(on){s[d]=1;}else{delete s[d];}
      save(s);
      if(on){
        r.el.classList.remove('pulse'); void r.el.offsetWidth; r.el.classList.add('pulse');
        embers(r.el,9,34); buzz(12);
      }else{ sfxOff(); buzz(6); }
      var n=render(on);
      if(on && n<rigs.length) sfxLight(n-1);
    });
  });
  document.getElementById('reset').addEventListener('click',function(){ save({}); render(false); buzz(8); });
  render(false);

  /* ══════════ サムネのスケルトン ══════════ */
  [].slice.call(document.querySelectorAll('.shot')).forEach(function(shot){
    var img=shot.querySelector('img'), skel=shot.querySelector('.skel');
    function ready(){ img.classList.add('ready'); skel.classList.add('gone'); setTimeout(function(){skel.remove();},600); }
    if(img.complete&&img.naturalWidth>0){ready();}else{img.addEventListener('load',ready);img.addEventListener('error',ready);}
  });

  /* ══════════ スクロールで出す ══════════ */
  if('IntersectionObserver' in window && !reduce){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});
    },{threshold:.16,rootMargin:'0px 0px -8% 0px'});
    days.forEach(function(d){io.observe(d);});
  }else{ days.forEach(function(d){d.classList.add('in');}); }

  /* ══════════ 月のパララックス ══════════ */
  var moon=document.getElementById('moon'), ticking=false;
  if(!reduce) window.addEventListener('scroll',function(){
    if(ticking) return; ticking=true;
    requestAnimationFrame(function(){
      var y=window.pageYOffset||0; if(y<420) moon.style.transform='translateY('+(y*.26)+'px)';
      ticking=false;
    });
  },{passive:true});

  /* ══════════ 生き物＋炎のループ ══════════ */
  if(!reduce){
    var head=document.querySelector('.head'), tplBat=document.getElementById('tpl-bat');
    var bats=[].slice.call(document.querySelectorAll('.bat')).map(function(el,i){
      el.appendChild(tplBat.content.cloneNode(true));
      el.style.width=el.dataset.w+'px';
      return {el:el,wl:el.querySelector('.wingL'),wr:el.querySelector('.wingR'),w:+el.dataset.w,
        x:0,y:0,px:0,py:0,tx:0,ty:0,next:0,seed:i*13.7+3,flap:8+Math.random()*3,
        phase:Math.random()*6.28,speed:.016+Math.random()*.012};
    });
    var box={w:360,h:300};
    function measure(){var r=head.getBoundingClientRect();box.w=r.width;box.h=r.height;}
    measure(); window.addEventListener('resize',measure,{passive:true});
    bats.forEach(function(b,i){
      b.x=b.tx=(i===1?box.w*.74:box.w*.06+i*8); b.y=b.ty=26+i*30; b.px=b.x; b.py=b.y;
      setTimeout(function(){b.el.classList.add('show');},320+i*160);
    });

    var gWrap=document.querySelector('.foot .ghost');
    var gBody=document.getElementById('gBody'),gEyes=document.getElementById('gEyes'),gMouth=document.getElementById('gMouth');
    var gBlinkAt=2+Math.random()*3, gBlinkEnd=0, cheerUntil=0;
    window.__ghostCheer=function(){cheerUntil=performance.now()/1000+1.8;};

    var t0=performance.now(), running=true;
    document.addEventListener('visibilitychange',function(){
      if(document.hidden){ running=false; }
      else if(!running){ running=true; t0=performance.now()-last*1000; requestAnimationFrame(loop); }
    });
    var last=0;

    function loop(now){
      if(!running) return;
      var t=(now-t0)/1000; last=t;

      bats.forEach(function(b){
        if(t>b.next){
          var side=Math.random()<.5?0:1;
          b.tx=(side?box.w*(.62+Math.random()*.28):box.w*(.02+Math.random()*.24))-b.w/2;
          b.ty=12+Math.random()*(box.h*.44);
          b.next=t+2.2+Math.random()*3.6;
        }
        b.px=b.x; b.py=b.y;
        b.x+=(b.tx-b.x)*b.speed+wob(t,b.seed)*0.9;
        b.y+=(b.ty-b.y)*b.speed*1.15+wob(t*1.23,b.seed+5)*0.7;
        var dx=b.x-b.px, dy=b.y-b.py;
        var bank=Math.max(-16,Math.min(16,dx*7)), face=dx<-0.12?-1:1;
        b.el.style.transform='translate3d('+b.x.toFixed(2)+'px,'+b.y.toFixed(2)+'px,0) rotate('+bank.toFixed(2)+'deg) scaleX('+face+')';
        b.phase+=b.flap*(dy<0?1.35:.75)*0.016;
        var ang=Math.sin(b.phase)*20, sy=.42+.58*Math.abs(Math.cos(b.phase*.5));
        b.wl.setAttribute('transform','translate(35,15) rotate('+(-ang)+') scale(1,'+sy.toFixed(3)+') translate(-35,-15)');
        b.wr.setAttribute('transform','translate(45,15) rotate('+ang+') scale(1,'+sy.toFixed(3)+') translate(-45,-15)');
      });

      /* カボチャ：灯っている間ずっと、炎が揺れて顔も動く */
      rigs.forEach(function(r){
        if(!r.on) return;
        var s=r.seed;
        var breath=1+wob(t*1.1,s)*0.05;
        r.fOut.setAttribute('d',flameD(t,s,1));
        r.fMid.setAttribute('d',flameD(t*1.19,s+2.2,.72));
        r.fIn.setAttribute('d',flameD(t*1.41,s+4.4,.44));
        r.flame.style.transform='translateY('+(wob(t*1.7,s+9)*1.2).toFixed(2)+'px) scale('+breath.toFixed(3)+','+(2-breath).toFixed(3)+')';
        /* まばたき＋横目 */
        if(t>r.blinkAt){ r.blinkEnd=t+.11; r.blinkAt=t+2+Math.random()*4.5; }
        var k=(t<r.blinkEnd)?.1:1, look=wob(t*.37,s+3)*1.5;
        r.eyeL.setAttribute('transform','translate('+(30+look).toFixed(2)+',45) scale(1,'+k+') translate(-30,-45)');
        r.eyeR.setAttribute('transform','translate('+(50+look).toFixed(2)+',45) scale(1,'+k+') translate(-50,-45)');
        /* 口はロウソクの息づかいに合わせて動く */
        var m=1+wob(t*1.6,s+6)*.09;
        r.mouth.setAttribute('transform','translate('+(40+look*.6).toFixed(2)+',60) scale('+m.toFixed(3)+','+(1/m).toFixed(3)+') translate(-40,-60)');
      });

      if(gBody){
        var hop=(cheerUntil>now/1000)?Math.abs(Math.sin((cheerUntil-now/1000)*7))*16:0;
        gWrap.style.transform='translate3d(0,'+(wob(t*.55,1.7)*7-hop).toFixed(2)+'px,0) rotate('+(wob(t*.4,9.1)*3).toFixed(2)+'deg)';
        var sx=1+wob(t*.9,4.2)*.045;
        gBody.setAttribute('transform','translate(24,30) scale('+sx.toFixed(3)+','+(2-sx).toFixed(3)+') translate(-24,-30)');
        if(t>gBlinkAt){ gBlinkEnd=t+.12; gBlinkAt=t+2.2+Math.random()*4.5; }
        var gk=(t<gBlinkEnd)?.08:1, gl=wob(t*.33,12.4)*1.6;
        gEyes.setAttribute('transform','translate('+gl.toFixed(2)+',24) scale(1,'+gk+') translate(0,-24)');
        gMouth.setAttribute('transform','translate('+(gl*.6).toFixed(2)+',0)');
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  /* 動画を開いたら音を止める */
  [].slice.call(document.querySelectorAll('.card')).forEach(function(a){a.addEventListener('click',stopBgm);});
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ stopBgm(); } else if(want){ startBgm(); }
  });
  window.addEventListener('pagehide',stopBgm);
})();
</script>
