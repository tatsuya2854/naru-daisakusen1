<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170C24">
<title>Halloween大作戦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --hw-night:#170C24;
  --hw-night2:#211135;
  --hw-pumpkin:#FF7A18;
  --hw-ember:#FFB63A;
  --hw-ghost:#C9B6FF;
  --hw-slime:#8BE04E;
  --hw-witch:#FF4D7E;
  --hw-bone:#FFF6E9;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 50% 0%, #35134F 0%, #1E1030 40%, #120920 100%) no-repeat;
  background-attachment:fixed;
  min-height:100%;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Yu Gothic UI","Meiryo",sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
.hw-wrap{
  max-width:680px;
  margin:0 auto;
  background:var(--hw-night);
  overflow:hidden;
  position:relative;
}
@media (min-width:700px){
  .hw-wrap{margin:24px auto;border-radius:24px;box-shadow:0 24px 60px -26px #000;}
}

/* ---------- ヘッダー ---------- */
.hw-head{
  position:relative;
  padding:46px 20px 40px;
  text-align:center;
  color:#fff;
  background:
    radial-gradient(circle at 50% 4%, rgba(255,182,58,.30), transparent 46%),
    radial-gradient(circle at 10% 92%, rgba(139,224,78,.14), transparent 46%),
    linear-gradient(170deg,#3A1553 0%,#211135 58%,#170C24 100%);
  overflow:hidden;
}
.hw-moon{
  position:absolute;top:20px;left:50%;margin-left:-33px;
  width:66px;height:66px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#FFEFC2,#FFC24D 60%,#FF9A2E);
  box-shadow:0 0 46px 16px rgba(255,183,71,.4);
}
.hw-moon::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 66% 62%, rgba(198,138,44,.5) 6px, transparent 7px),
    radial-gradient(circle at 34% 66%, rgba(198,138,44,.36) 4px, transparent 5px),
    radial-gradient(circle at 58% 30%, rgba(198,138,44,.3) 3px, transparent 4px);
}
.hw-bat{
  position:absolute;color:#120A1C;
  filter:drop-shadow(0 0 6px rgba(201,182,255,.5));
  animation:hw-fly 7s ease-in-out infinite;
}
.hw-bat svg{display:block;width:100%;height:auto;}
.hw-bat.b1{top:30px;left:6%;width:44px;}
.hw-bat.b2{top:82px;right:8%;width:32px;animation-delay:1.7s;}
.hw-bat.b3{bottom:38px;left:14%;width:24px;opacity:.55;animation-delay:3.4s;}
@keyframes hw-fly{
  0%,100%{transform:translate(0,0) rotate(-4deg);}
  50%{transform:translate(16px,-14px) rotate(6deg);}
}
.hw-title{
  position:relative;margin:36px 0 0;
  font-family:"Creepster","M PLUS Rounded 1c",cursive;
  font-size:46px;line-height:1;letter-spacing:.04em;
  color:var(--hw-pumpkin);
  text-shadow:0 0 22px rgba(255,122,24,.65),3px 4px 0 #5A1B0B;
}
.hw-sub{
  position:relative;margin:10px 0 0;
  font-size:26px;font-weight:800;color:#fff;
  text-shadow:2px 3px 0 #6B2FA8;
}
.hw-lead{position:relative;margin:16px 0 0;font-size:13.5px;font-weight:500;color:#E9DDFF;}
.hw-lead strong{color:var(--hw-ember);font-weight:800;}

/* 進捗 */
.hw-progress{
  position:relative;display:inline-flex;align-items:center;gap:8px;
  margin-top:16px;padding:7px 16px 7px 12px;
  background:rgba(255,255,255,.09);
  border:1.5px solid rgba(255,182,58,.5);
  border-radius:999px;
  font-size:13px;font-weight:800;color:#FFD98A;
}
.hw-progress b{color:#fff;font-size:16px;}

/* ドリップ */
.hw-drip{position:relative;height:9px;background:var(--hw-pumpkin);z-index:3;}
.hw-drip::after{
  content:"";position:absolute;top:100%;left:0;right:0;height:16px;
  background:radial-gradient(circle at 13px 0,var(--hw-pumpkin) 12px,transparent 13px) repeat-x;
  background-size:52px 30px;
}
.hw-drip::before{
  content:"";position:absolute;top:100%;left:26px;right:0;height:22px;
  background:radial-gradient(circle at 11px 0,var(--hw-pumpkin) 9px,transparent 10px) repeat-x;
  background-size:52px 30px;
}

/* ---------- BGM ボタン ---------- */
.hw-bgm{
  position:absolute;top:14px;right:14px;z-index:5;
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;
  background:rgba(23,12,36,.72);
  border:1.5px solid rgba(255,182,58,.55);
  border-radius:999px;
  color:#FFD98A;font-family:inherit;font-size:12px;font-weight:800;
  cursor:pointer;
  backdrop-filter:blur(4px);
  transition:transform .2s ease,box-shadow .2s ease;
}
.hw-bgm:hover{transform:scale(1.05);box-shadow:0 0 16px -2px rgba(255,182,58,.7);}
.hw-bgm.on{background:var(--hw-ember);color:#3A1E00;border-color:#fff;}
.hw-bgm .wave{display:inline-flex;align-items:flex-end;gap:2px;height:12px;}
.hw-bgm .wave i{width:2.5px;background:currentColor;border-radius:2px;height:4px;}
.hw-bgm.on .wave i{animation:hw-eq .9s ease-in-out infinite;}
.hw-bgm.on .wave i:nth-child(2){animation-delay:.15s;}
.hw-bgm.on .wave i:nth-child(3){animation-delay:.3s;}
@keyframes hw-eq{0%,100%{height:4px;}50%{height:12px;}}

/* ---------- 日別リスト ---------- */
.hw-list{list-style:none;margin:0;padding:22px 0 0;}
.hw-day{
  display:grid;
  grid-template-columns:74px minmax(0,1fr);
  gap:10px;
  align-items:center;
  padding:16px 14px;
  color:#fff;
}
.hw-day:nth-child(odd){background:var(--hw-night2);}
.hw-day:nth-child(even){background:var(--hw-night);}
.hw-day+.hw-day{border-top:2px dashed rgba(255,122,24,.32);}
.hw-day:nth-child(1){--hw-c:var(--hw-pumpkin);}
.hw-day:nth-child(2){--hw-c:var(--hw-ghost);}
.hw-day:nth-child(3){--hw-c:var(--hw-witch);}
.hw-day:nth-child(4){--hw-c:var(--hw-slime);}

/* ---------- カボチャ（タップで点灯） ---------- */
.hw-lamp{
  position:relative;
  width:74px;height:82px;
  border:0;padding:0;background:none;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.hw-lamp svg.pk{
  display:block;width:100%;height:auto;
  filter:grayscale(.72) brightness(.5);
  transition:filter .45s ease,transform .3s cubic-bezier(.2,.8,.3,1);
}
.hw-lamp:hover svg.pk{transform:scale(1.06) rotate(-4deg);}
.hw-lamp:active svg.pk{transform:scale(.94);}
.hw-lamp .face{fill:#2A1A2E;transition:fill .4s ease;}
.hw-lamp .halo{
  position:absolute;left:50%;top:54%;width:96px;height:96px;
  margin:-48px 0 0 -48px;border-radius:50%;
  background:radial-gradient(circle,var(--hw-c) 0%,transparent 66%);
  opacity:0;transition:opacity .5s ease;pointer-events:none;
}
.hw-lamp .flame{
  position:absolute;left:50%;top:-4px;margin-left:-11px;
  width:22px;height:30px;
  opacity:0;transform:scale(.3) translateY(10px);
  transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.6,.4,1);
  pointer-events:none;
}
/* 点灯 */
.hw-lamp.lit svg.pk{filter:none drop-shadow(0 0 10px var(--hw-c));filter:drop-shadow(0 0 10px var(--hw-c));}
.hw-lamp.lit .face{fill:#FFE27A;}
.hw-lamp.lit .halo{opacity:.42;animation:hw-flicker 2.6s ease-in-out infinite;}
.hw-lamp.lit .flame{opacity:1;transform:scale(1) translateY(0);animation:hw-flick 1.1s ease-in-out infinite;}
@keyframes hw-flicker{0%,100%{opacity:.42;}45%{opacity:.62;}70%{opacity:.34;}}
@keyframes hw-flick{
  0%,100%{transform:scale(1) translateY(0) rotate(-2deg);}
  50%{transform:scale(1.14,.94) translateY(-2px) rotate(3deg);}
}
.hw-lamp .hint{
  position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);
  font-size:9.5px;font-weight:800;color:#8E7BA8;white-space:nowrap;
  transition:opacity .3s ease;
}
.hw-lamp.lit .hint{opacity:0;}

/* ---------- カード ---------- */
.hw-card{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0;text-decoration:none;color:#fff;}
.hw-meta{display:flex;align-items:center;gap:9px;}
.hw-part{
  border:1.5px solid var(--hw-c);color:var(--hw-c);
  border-radius:999px;padding:2px 12px;
  font-size:11.5px;font-weight:700;white-space:nowrap;
}
.hw-num{font-size:22px;font-weight:800;color:#fff;text-shadow:0 0 12px var(--hw-c);}
.hw-thumb{
  min-width:0;background:var(--hw-bone);
  border-radius:13px;padding:6px 6px 2px;
  box-shadow:0 4px 0 rgba(0,0,0,.5);
  transition:transform .3s cubic-bezier(.2,.8,.3,1),box-shadow .3s ease;
}
.hw-thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#E6DACD;}
.hw-cap{display:block;color:#2C1B33;font-size:11.5px;font-weight:700;padding:7px 3px 6px;line-height:1.45;}
.hw-cap em{font-style:normal;color:#B23A1A;}
.hw-card:hover .hw-thumb,.hw-card:focus-visible .hw-thumb{
  transform:translateY(-8px) rotate(-.8deg);
  box-shadow:0 13px 0 rgba(0,0,0,.5),0 0 26px -2px var(--hw-c);
}
.hw-card:focus-visible{outline:3px solid var(--hw-c);outline-offset:4px;}
.hw-card:active .hw-thumb{transform:translateY(-2px);}

/* ---------- フッター ---------- */
.hw-foot{
  text-align:center;padding:28px 18px 34px;color:#fff;
  font-size:13.5px;font-weight:700;
  background:radial-gradient(circle at 50% 130%,rgba(139,224,78,.26),transparent 62%),var(--hw-night2);
}
.hw-foot .ghost{width:46px;margin:0 auto 8px;animation:hw-float 3.6s ease-in-out infinite;}
.hw-foot .ghost svg{display:block;width:100%;height:auto;}
@keyframes hw-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.hw-clear{
  margin-top:16px;background:none;border:0;
  color:#7C6795;font-family:inherit;font-size:11px;font-weight:700;
  text-decoration:underline;cursor:pointer;
}
.hw-done{color:var(--hw-ember);font-size:15px;}

@media (min-width:620px){
  .hw-head{padding:54px 26px 46px;}
  .hw-title{font-size:58px;}
  .hw-sub{font-size:31px;}
  .hw-day{grid-template-columns:86px minmax(0,1fr);gap:16px;padding:18px 20px;}
  .hw-lamp{width:86px;height:94px;}
  .hw-card{grid-template-columns:132px minmax(0,1fr);align-items:center;gap:16px;}
  .hw-meta{flex-direction:column;align-items:flex-start;gap:6px;}
  .hw-num{font-size:26px;}
  .hw-cap{font-size:12.5px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
}
</style>
</head>

<script>
(function(){
  var KEY='hw-lit-2026';
  var lamps=[].slice.call(document.querySelectorAll('.hw-lamp'));
  var cnt=document.getElementById('cnt');
  var msg=document.getElementById('msg');
  var DEFAULT_MSG='待ってろよ！今日よりカワイイ明日の自分！';

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
  function save(s){ try{ localStorage.setItem(KEY,JSON.stringify(s)); }catch(e){} }

  function render(){
    var s=load(), n=0;
    lamps.forEach(function(b){
      var on=!!s[b.dataset.day];
      b.classList.toggle('lit',on);
      b.setAttribute('aria-pressed',on?'true':'false');
      if(on) n++;
    });
    cnt.textContent=n;
    if(n===lamps.length){
      msg.innerHTML='<span class="hw-done">全部灯った！最高！🏆</span><br>'+DEFAULT_MSG;
    }else{
      msg.textContent=DEFAULT_MSG;
    }
  }

  lamps.forEach(function(b){
    b.addEventListener('click',function(){
      var s=load(), d=b.dataset.day;
      if(s[d]){ delete s[d]; } else { s[d]=1; sfx('light'); }
      save(s); render();
    });
  });
  document.getElementById('clear').addEventListener('click',function(){ save({}); render(); });
  render();

  /* ---------- BGM（Web Audioで生成。音源ファイル不要） ---------- */
  var ctx=null, master=null, timer=null, step=0, playing=false;
  var btn=document.getElementById('bgm');
  var SCALE=[220.00,261.63,293.66,329.63,349.23,415.30]; // Aマイナー系のもの悲しい音階
  var MELODY=[0,2,3,2,5,3,2,0,3,2,4,2];

  function ac(){
    if(!ctx){
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      ctx=new AC();
      master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
    }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  function note(freq,t,dur,type,vol){
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||'triangle'; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol||.18,t+.02);
    g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
  }
  function tick(){
    var t=ctx.currentTime+.06;
    var f=SCALE[MELODY[step%MELODY.length]];
    note(f,t,.5,'triangle',.16);
    if(step%4===0) note(55,t,1.1,'sine',.34);          // 低音のうねり
    if(step%12===0) note(f*4,t,1.6,'sine',.06);        // 遠くの鐘
    if(step%4===2) note(f*1.5,t,.32,'triangle',.07);
    step++;
  }
  function sfx(kind){
    if(!playing) return;
    var t=ctx.currentTime;
    note(880,t,.18,'triangle',.12); note(1320,t+.06,.34,'sine',.1);
  }
  function stopBgm(){
    if(!playing) return;
    playing=false;
    btn.classList.remove('on'); btn.setAttribute('aria-pressed','false');
    if(master && ctx){
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value,ctx.currentTime);
      master.gain.linearRampToValueAtTime(0,ctx.currentTime+.35);
    }
    clearInterval(timer); timer=null;
  }
  function startBgm(){
    if(!ac()){ btn.disabled=true; btn.textContent='BGM非対応'; return; }
    playing=true; btn.classList.add('on'); btn.setAttribute('aria-pressed','true');
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(0,ctx.currentTime);
    master.gain.linearRampToValueAtTime(.5,ctx.currentTime+.8);
    tick(); timer=setInterval(tick,430);
  }
  btn.addEventListener('click',function(){ playing ? stopBgm() : startBgm(); });

  /* 動画を開いたらBGMを止める（音がかぶらないように） */
  [].slice.call(document.querySelectorAll('.hw-card')).forEach(function(a){
    a.addEventListener('click',stopBgm);
  });
  /* 裏に回ったら止める（別タブで動画が始まるケースを含む） */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) stopBgm();
  });
  window.addEventListener('pagehide',stopBgm);
})();
</script>
</body>
</html>
